<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vivenza Sob Medida · Versões do site</title>
  <!-- Página interna de apresentação: não indexar. -->
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="v1-atelier/assets/favicon.svg" type="image/svg+xml">
  <style>
    :root {
      --bg: #F6F1E9; --surface: #FBF8F3; --text: #25221F; --muted: #5B544B;
      --border: #DDD2C2; --accent: #9E4F2C; --focus: #1F5FA8;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1A1714; --surface: #26211D; --text: #ECE5DB; --muted: #B6AB9C;
        --border: #3A332C; --accent: #D69468; --focus: #8CC2FF;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 400 1rem/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    main { max-width: 760px; margin: 0 auto; padding: 64px 16px; }
    h1 { margin: 0 0 8px; font: 500 2rem/1.2 Georgia, "Times New Roman", serif; }
    .intro { margin: 0 0 40px; color: var(--muted); }
    ol { display: grid; gap: 12px; margin: 0; padding: 0; list-style: none; }
    a.version {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 4px 16px;
      padding: 20px 24px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: inherit;
      text-decoration: none;
    }
    a.version:hover { border-color: var(--accent); }
    a.version:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
    .version__tag { color: var(--accent); font-weight: 700; font-size: .875rem; letter-spacing: .08em; }
    .version__name { font-size: 1.125rem; font-weight: 600; }
    .version__desc { flex-basis: 100%; color: var(--muted); font-size: .9375rem; }
  </style>
</head>
<body>
  <main>
    <h1>Vivenza Sob Medida</h1>
    <p class="intro">Versões do site para apresentação ao cliente.</p>

    <!-- Para adicionar uma versão: crie ./vN-alias/ e acrescente um <li> abaixo. -->
    <ol>
      <li>
        <a class="version" href="v1-atelier/index.html">
          <span class="version__tag">V1</span>
          <span class="version__name">Atelier</span>
          <span class="version__desc">Editorial e acolhedora: marfim, terracota e serifa clássica, com bloco técnico escuro para a fábrica.</span>
        </a>
      </li>
    </ol>
  </main>
</body>
</html>
